# Design stub for a future backend — see schema.sql and the "why" note
# there. Nothing here is implemented or deployed; the app is a static
# export today (next.config.ts's `output: "export"`) with no server.
# This is the API surface that feature would need if it's ever built.
openapi: 3.0.3
info:
  title: JomKomute planned-trip pings (design stub, not implemented)
  version: "0.0.0"
  description: >
    No auth, no accounts. Each ping is keyed by a client-generated
    ping_key (see schema.sql) so a device can manage its own ping
    without the server learning a stable cross-day identity. See
    schema.sql's "Anti-abuse" section for the full threat-model
    writeup; the rate-limit header and suppressed counts below are
    layers 1 and 2 of that design.

paths:
  /pings/{pingKey}:
    put:
      summary: Create or replace a ping (idempotent).
      description: >
        Called when a route is saved/edited, or once per day the app is
        opened, for whichever occurrence computeNextRoute (lib/next-route.ts)
        says is coming up next.
      parameters:
        - name: pingKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station, tripDate, timeBucket]
              properties:
                station:
                  type: string
                  example: Maluri
                lineId:
                  type: string
                  example: putrajaya
                tripDate:
                  type: string
                  format: date
                  example: "2026-08-04"
                timeBucket:
                  type: integer
                  description: minutes since midnight, rounded to nearest 15
                  example: 450
      responses:
        "204":
          description: Stored.
        "429":
          description: >
            Per-IP rate limit exceeded (schema.sql anti-abuse layer 1,
            enforced at the edge/gateway — short-TTL counters, not this
            API's own state).

    delete:
      summary: Remove a ping. No-op if it doesn't exist.
      description: >
        Called when a saved route is deleted, or when the dashboard's
        "Change plan" modal (components/change-plan-modal.tsx) adds a
        skip exception for that date — mirrors the existing whole-day
        skip logic so the count drops immediately, not just the UI.
      parameters:
        - name: pingKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted, or didn't exist.

  /pings/counts:
    get:
      summary: Count of pings near a station and time.
      description: >
        What the dashboard (app/dashboard/page.tsx) would call instead
        of lib/crowd-mock.ts's mockCrowdFor once this is real.
      parameters:
        - name: station
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: bucket
          in: query
          required: true
          schema:
            type: integer
          description: minutes since midnight
        - name: window
          in: query
          schema:
            type: integer
            default: 30
          description: +/- minutes around bucket to include
      responses:
        "200":
          description: >
            count is null and suppressed is true below the publication
            floor (schema.sql anti-abuse layer 2, e.g. fewer than 20
            pings) — the dashboard should render "not enough data yet"
            rather than a real number in that case. A count that's a
            statistical outlier against the historical ridership
            baseline (layer 3) may also come back suppressed pending
            review rather than shown immediately.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    nullable: true
                    example: 182
                  suppressed:
                    type: boolean
                    description: true if count is null because it's below the floor or held for review

# Full anti-abuse threat model, including what's explicitly NOT solved
# by any of this (a resourced, patient, rotating-IP attacker), lives in
# schema.sql's "Anti-abuse" section rather than duplicated here.
