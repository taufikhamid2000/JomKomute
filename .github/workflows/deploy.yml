name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Just a git push to gh-pages, not the Pages Deployments API — no
# `github-pages` environment required, unlike actions/deploy-pages. Pages
# is set to "Deploy from a branch" (gh-pages, /root) in repo settings,
# which only watches and serves that branch; this job is what keeps it
# updated.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
