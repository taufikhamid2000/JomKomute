name: Apply Supabase migrations

# Trigger lives here (GitHub Actions requires that — it has to be
# defined in the repo receiving the push), but the actual migration
# steps live in taufikhamid2000/template's reusable workflow, shared
# across every project with a supabase/migrations directory. See that
# workflow's own header for why it uses `db query -f` per file rather
# than `db push` (master_db is shared with duitduit and others, each
# with a separate migration history `db push` would step on).
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  migrate:
    uses: taufikhamid2000/template/.github/workflows/supabase-migrate.yml@master
    secrets: inherit
